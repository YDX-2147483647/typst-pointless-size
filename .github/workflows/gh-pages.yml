name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TYPST_FONT_PATHS: ${{ github.workspace }}/fonts/
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Required by `git describe --tags` in `just ref-build`
      - uses: taiki-e/install-action@v2
        with:
          tool: just, sd, typstyle
      - uses: hustcer/setup-nu@v3
      - uses: typst-community/setup-typst@v5
        with:
          typst-versions-file: .github/typst-versions.yaml
          zip-packages-yaml: |
            # See https://github.com/solstice23/typst-ribbony/issues/2
            local:
              ribbony:
                0.1.1: https://github.com/solstice23/typst-ribbony/archive/ea97d10a48e71c875bc8dd09f51fec2ba880f6d4.zip
            preview: {}

      - name: Restore cached fonts
        uses: actions/cache@v5
        id: cache
        with:
          path: |
            fonts/
          key: fonts-2026-05-15
          restore-keys: |
            fonts-2026-05-15
            fonts-
      - name: Install fonts
        shell: bash
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir fonts/
          cd fonts/
          
          curl -LO https://github.com/adobe-fonts/source-han-serif/releases/download/2.003R/01_SourceHanSerif.ttc.zip
          7z x 01_SourceHanSerif.ttc.zip
          rm 01_SourceHanSerif.ttc.zip

          curl -LO https://github.com/typst-doc-cn/guide/releases/download/files/fonts.7z
          7z e fonts.7z simkai.ttf
          rm fonts.7z

      - run: just ref-check
      - run: just gh-pages

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./target/
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
